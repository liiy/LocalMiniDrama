[project]
name = "local-mini-drama-backend"
version = "1.0.0"
description = "LocalMiniDrama 后端 Python 重构版（FastAPI + MySQL），与 Node 版 /api/v1 契约等价"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "pymysql>=1.1",
    "cryptography>=43.0",
    "pydantic>=2.8",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "Pillow>=10.4",
    "PyJWT>=2.9",
    "dramatiq[redis]>=1.17,<2",
    "redis>=5,<7",
    "qdrant-client>=1.9,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
