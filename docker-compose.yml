version: "3.9"

services:
  # 1. 关系型数据库 MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: lmd-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lmd
      MYSQL_USER: lmd
      MYSQL_PASSWORD: lmd
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - lmd-mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ulmd", "-plmd"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - lmd-network

  # 2. 缓存与 Dramatiq 消息队列 Redis 7
  redis:
    image: redis:7-alpine
    container_name: lmd-redis
    ports:
      - "6379:6379"
    volumes:
      - lmd-redis-data:/data
    networks:
      - lmd-network

  # 3. 向量数据库 Qdrant（长篇小说 RAG 与长期记忆库）
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: lmd-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - lmd-qdrant-data:/qdrant/storage
    networks:
      - lmd-network

  # 4. 后端 API 服务 (FastAPI + Uvicorn)
  backend-api:
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: lmd-backend-api
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    env_file:
      - ./python-backend/.env
    environment:
      # 容器地址覆盖 .env 中的本机地址，其余配置仍统一由 .env 提供。
      LMD_DATABASE_URL: mysql+pymysql://lmd:lmd@mysql:3306/lmd?charset=utf8mb4
      LMD_REDIS_URL: redis://redis:6379/0
      LMD_QDRANT_URL: http://qdrant:6333
      LMD_QUEUE_BACKEND: dramatiq
      LMD_QUEUE_WORKER_ENABLED: "false"
      LMD_MASTER_KEY_FILE: /app/data/.lmd_master_key
    volumes:
      - ./python-backend/data/storage:/app/data/storage
      - ./python-backend/configs:/app/configs
    ports:
      - "5679:5679"
    networks:
      - lmd-network

  # 5. 后端异步工作流 Worker (Dramatiq Worker)
  backend-worker:
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: lmd-backend-worker
    command: ["dramatiq", "app.tasks.worker_entry", "--queues", "lmd_tasks", "--processes", "2", "--threads", "4"]
    depends_on:
      - backend-api
      - redis
    env_file:
      - ./python-backend/.env
    environment:
      LMD_DATABASE_URL: mysql+pymysql://lmd:lmd@mysql:3306/lmd?charset=utf8mb4
      LMD_REDIS_URL: redis://redis:6379/0
      LMD_QUEUE_BACKEND: dramatiq
      LMD_QUEUE_WORKER_ENABLED: "false"
      LMD_MASTER_KEY_FILE: /app/data/.lmd_master_key
    volumes:
      - ./python-backend/data/storage:/app/data/storage
      - ./python-backend/configs:/app/configs
    networks:
      - lmd-network

  # 6. MySQL Outbox 补偿投递器：负责把漏投任务可靠送入 Redis。
  backend-dispatcher:
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: lmd-backend-dispatcher
    command: ["python", "-m", "app.tasks.dispatcher_entry"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./python-backend/.env
    environment:
      LMD_DATABASE_URL: mysql+pymysql://lmd:lmd@mysql:3306/lmd?charset=utf8mb4
      LMD_REDIS_URL: redis://redis:6379/0
      LMD_QUEUE_BACKEND: dramatiq
      LMD_MASTER_KEY_FILE: /app/data/.lmd_master_key
    networks:
      - lmd-network

  # 7. 前端 Web 服务 (Vue 3 + Nginx 反向代理)
  frontweb:
    build:
      context: ./frontweb
      dockerfile: Dockerfile
    container_name: lmd-frontweb
    depends_on:
      - backend-api
    ports:
      - "80:80"
    networks:
      - lmd-network

  # 8. Prometheus 监控采集服务
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: lmd-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - lmd-prom-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - lmd-network

volumes:
  lmd-mysql-data:
  lmd-redis-data:
  lmd-qdrant-data:
  lmd-prom-data:

networks:
  lmd-network:
    driver: bridge
